# SHRI-AI (www.shri-ai.org) — http-level settings.
# Install: /etc/nginx/conf.d/shri-ai-http.conf  (conf.d is included inside
# the http {} block by Ubuntu's stock nginx.conf).

# ── Compression ──
# HTML, CSS, JS, JSON, SVG and fonts compress 3-5x; images (WebP/PNG) and
# woff2 are already compressed and are left alone. Level 6 is the usual
# speed/size sweet spot and costs a t3.large next to nothing.
gzip on;
gzip_vary on;
gzip_proxied any;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_types
    text/plain
    text/css
    text/xml
    application/javascript
    application/json
    application/xml
    application/manifest+json
    image/svg+xml;

# Optional, if `libnginx-mod-http-brotli-filter` is installed (sudo apt
# install libnginx-mod-http-brotli-filter): brotli is ~15-20% smaller than
# gzip for JS/CSS. Uncomment both lines.
# brotli on;
# brotli_types text/plain text/css text/xml application/javascript application/json application/xml image/svg+xml;

# ── Moved images ──
# Images were reorganised into /images/<section>/. Old URLs (bookmarks,
# search results, other sites) redirect permanently to the new ones; see
# the `if ($shri_moved)` line in shri-ai-site.conf.
map $uri $shri_moved {
    default                          "";
    /shri-ai-logo.webp               /images/brand/shri-ai-logo.webp;
    /shri-ai-logo-trans.webp         /images/brand/shri-ai-logo-trans.webp;
    /banner-hospital.webp            /images/home/banner-indostates.webp;
    /stroke-brain.webp               /images/home/stroke-brain.webp;
    /oncotrace-breast.webp           /images/home/oncotrace-breast.webp;
    /visolve-logo.webp               /images/services/visolve-logo.webp;
    /indostateshealth.webp           /images/services/indostateshealth.webp;
    /Balasubramaniam-AV.webp         /images/team/Balasubramaniam-AV.webp;
    /Gowrishankar-Palaniswamy.webp   /images/team/Gowrishankar-Palaniswamy.webp;
    /manoj.webp                      /images/team/manoj.webp;
    /Rajesh-Rangaswamy.webp          /images/team/Rajesh-Rangaswamy.webp;
    /Sena-Palanisami.webp            /images/team/Sena-Palanisami.webp;
    /SK-Muruganand.webp              /images/team/SK-Muruganand.webp;
    ~^/shri-health/(?<shri_card>[a-z-]+(?:-640)?\.webp)$  /images/shri-health/$shri_card;
}
