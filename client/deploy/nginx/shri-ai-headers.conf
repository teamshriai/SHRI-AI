# SHRI-AI security headers. Install: /etc/nginx/snippets/shri-ai-headers.conf
# Included in every location of shri-ai-site.conf: nginx drops server-level
# add_header lines in any location that sets its own, so they are repeated
# through this one file instead.
add_header Strict-Transport-Security "max-age=31536000" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
