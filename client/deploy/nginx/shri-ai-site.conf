# SHRI-AI (www.shri-ai.org) — the website's locations.
#
# Install: /etc/nginx/snippets/shri-ai-site.conf, and include it INSIDE the
# existing certbot-managed block, next to the demo apps' snippets:
#
#     server {
#         listen 443 ssl http2;          # add `http2` if it isn't there yet
#         server_name www.shri-ai.org;
#         root /var/www/shri-ai;
#         index index.html;
#         include /etc/nginx/snippets/shri-ai-site.conf;
#         include /etc/nginx/snippets/dev-pharmacy.conf;   # demo apps, unchanged
#         ... certbot's ssl_certificate lines ...
#     }
#
# The /dev/<module>/ demo apps keep their own snippets: their longer
# `location /dev/<module>/` prefixes always win over the rules below.
# Then: sudo nginx -t && sudo systemctl reload nginx

server_tokens off;
charset utf-8;

# Old image URLs -> their new folders (map in shri-ai-http.conf).
if ($shri_moved) {
    return 301 $shri_moved;
}

# Cache-Control is sent only with successful responses (no `always`), so a
# 404 — say, mid-deploy — is never cached.

# Hashed JS/CSS bundles: the file name changes whenever the content does,
# so they can be cached for a year and never revalidated.
location ^~ /assets/ {
    try_files $uri =404;
    access_log off;
    include /etc/nginx/snippets/shri-ai-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# Self-hosted fonts: versioned file names (dm-sans-v17-*), same as above.
location ^~ /fonts/ {
    try_files $uri =404;
    access_log off;
    include /etc/nginx/snippets/shri-ai-headers.conf;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# Photos and logos: stable names, so a month in the browser cache, then
# served stale for a day while the browser revalidates in the background.
location ^~ /images/ {
    try_files $uri =404;
    access_log off;
    include /etc/nginx/snippets/shri-ai-headers.conf;
    add_header Cache-Control "public, max-age=2592000, stale-while-revalidate=86400";
}

# Favicons, robots.txt, sitemap.xml.
location ~* ^/(?:favicon-\d+\.png|apple-touch-icon\.png|robots\.txt|sitemap\.xml)$ {
    try_files $uri =404;
    access_log off;
    include /etc/nginx/snippets/shri-ai-headers.conf;
    add_header Cache-Control "public, max-age=86400";
}

# Pages: the built HTML (/, /careers/, /team/, /dev/) and the SPA fallback.
# Always revalidated, so a deploy is live on the next page load.
location / {
    try_files $uri $uri/ /index.html;
    include /etc/nginx/snippets/shri-ai-headers.conf;
    add_header Cache-Control "no-cache";
}
